<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solución Completada | EasyAssist</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --bg: #f8fafc;
      --card: #ffffff;
      --success: #16a34a;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    body.fade-in { opacity: 1; }
    body.fade-out { opacity: 0; }

    .container {
      background: var(--card);
      width: 90%;
      max-width: 520px;
      padding: 56px 48px;
      border-radius: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      text-align: center;
    }

    .logo-container { margin-bottom: 32px; }
    .logo-container img { height: 42px; width: auto; }

    /* Icono de éxito */
    .success-icon {
      width: 72px;
      height: 72px;
      background: #dcfce7;
      color: var(--success);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 24px;
    }

    .title {
      font-family: 'DM Serif Display', serif;
      font-size: 32px;
      margin-bottom: 16px;
      color: var(--text);
    }

    .subtitle {
      font-size: 17px;
      color: var(--muted);
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .btn-finish {
      display: inline-block;
      width: 100%;
      padding: 18px;
      background: var(--accent);
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
    }

    .btn-finish:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }

    .footer-note {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      font-size: 14px;
      color: var(--muted);
    }
  </style>
</head>
<body class="fade-in">

  <main class="container">

    <div class="logo-container">
      <img src="imagenes/easyassist.png" alt="EasyAssist Logo">
    </div>

    <div class="success-icon">✓</div>

    <h1 class="title">Incidencia resuelta</h1>

    <p class="subtitle">
      El proceso de asistencia ha finalizado con éxito. Usted ya debería disponer de acceso a internet en sus dispositivos.
    </p>

    <button class="btn-finish" onclick="go('seleccion.html')">
      Finalizar y volver al inicio
    </button>

    <div class="footer-note">
      Gracias por confiar en <strong>EasyAssist</strong> para resolver sus dudas tecnológicas.
    </div>

  </main>

  <script>
    function go(url) {
      document.body.classList.remove("fade-in");
      document.body.classList.add("fade-out");
      setTimeout(() => {
        window.location.href = url;
      }, 300);
    }
  </script>

</body>
</html>
