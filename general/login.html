<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Acceso | EasyAssist</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --bg: #f8fafc;
      --card: #ffffff;
      --red: #dc2626;
      --red-light: #fef2f2;
      --green: #16a34a;
      --green-light: #f0fdf4;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      opacity: 0;
      animation: fadeIn 0.5s ease forwards 0.1s;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* LOGO ARRIBA */
    .top-logo {
      margin-bottom: 28px;
    }

    .top-logo img {
      height: 52px;
      width: auto;
    }

    /* CARD */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }

    .card h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 26px;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .card h1 span {
      color: var(--accent);
    }

    .card .subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 28px;
    }

    /* TABS */
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 9px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      background: transparent;
      color: var(--muted);
      transition: background 0.2s, color 0.2s;
    }

    .tab-btn.active {
      background: white;
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    /* MENSAJE */
    .msg {
      display: none;
      font-size: 13px;
      font-weight: 500;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .msg.error {
      display: block;
      background: var(--red-light);
      color: var(--red);
      border: 1px solid #fecaca;
    }

    .msg.success {
      display: block;
      background: var(--green-light);
      color: var(--green);
      border: 1px solid #bbf7d0;
    }

    /* FORMULARIO */
    .form-section {
      display: none;
    }

    .form-section.active {
      display: block;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      padding: 11px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
      background: white;
    }

    .field input::placeholder {
      color: #94a3b8;
    }

    /* BOTÓN PRINCIPAL */
    .btn-primary {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 11px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }

    .btn-primary:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: scale(0.99);
    }

    /* FOOTER CARD */
    .card-footer {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    .card-footer span {
      cursor: pointer;
      color: var(--accent);
      font-weight: 600;
    }

    .card-footer span:hover {
      text-decoration: underline;
    }

    /* VOLVER */
    .link-back {
      margin-top: 24px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .link-back:hover {
      color: var(--accent);
    }

    footer {
      margin-top: 32px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>

<body>

  <div class="top-logo">
    <a href="presentacion.html">
      <img src="../imagenes/easyassist.png" alt="EasyAssist">
    </a>
  </div>

  <div class="card">

    <h1>Bienvenido <span>a EasyAssist</span></h1>
    <p class="subtitle">Accede o crea una cuenta para continuar</p>

    <div class="tabs">
      <button class="tab-btn active" id="tab-login">Iniciar sesión</button>
      <button class="tab-btn" id="tab-register">Registrarse</button>
    </div>

    <div id="msg" class="msg"></div>

    <!-- LOGIN -->
    <section id="login-section" class="form-section active">
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="tu@email.com">
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="login-password" placeholder="••••••••">
      </div>
      <button class="btn-primary" id="btn-login">Entrar</button>
    </section>

    <!-- REGISTER -->
    <section id="register-section" class="form-section">
      <div class="field">
        <label>Nombre</label>
        <input type="text" id="reg-name" placeholder="Tu nombre">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="tu@email.com">
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="reg-password" placeholder="Mínimo 8 caracteres">
      </div>
      <div class="field">
        <label>Repetir contraseña</label>
        <input type="password" id="reg-password2" placeholder="Repite la contraseña">
      </div>
      <button class="btn-primary" id="btn-register">Crear cuenta</button>
    </section>

    <div class="card-footer">
      ¿No tienes cuenta? <span id="footer-link">Regístrate</span>
    </div>

  </div>

  <a href="presentacion.html" class="link-back">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    Volver al inicio
  </a>

  <footer>EasyAssist &copy; 2025</footer>

  <script src="../js/auth.js"></script>

</body>
</html>
