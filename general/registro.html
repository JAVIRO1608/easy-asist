<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crear cuenta | EasyAssist</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --bg: #f8fafc;
      --card: #ffffff;
      --red: #dc2626;
      --red-light: #fef2f2;
      --green: #16a34a;
      --green-light: #f0fdf4;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      opacity: 0;
      animation: fadeIn 0.5s ease forwards 0.1s;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* LOGO */
    .top-logo {
      margin-bottom: 28px;
    }

    .top-logo img {
      height: 52px;
      width: auto;
    }

    /* CARD */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }

    .badge {
      display: inline-block;
      background: var(--accent-light);
      color: var(--accent);
      font-size: 12px;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 99px;
      border: 1px solid #bfdbfe;
      margin-bottom: 16px;
    }

    .card h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 26px;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .card h1 span {
      color: var(--accent);
    }

    .card .subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 28px;
      line-height: 1.6;
    }

    /* MENSAJE */
    .msg {
      display: none;
      font-size: 13px;
      font-weight: 500;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .msg.error {
      display: block;
      background: var(--red-light);
      color: var(--red);
      border: 1px solid #fecaca;
    }

    .msg.success {
      display: block;
      background: var(--green-light);
      color: var(--green);
      border: 1px solid #bbf7d0;
    }

    /* CAMPOS */
    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      padding: 11px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
      background: white;
    }

    .field input::placeholder {
      color: #94a3b8;
    }

    /* REQUISITOS CONTRASEÑA */
    .req-list {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .req {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .req .dot {
      width: 6px;
      height: 6px;
      border-radius: 99px;
      background: var(--border);
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .req.ok {
      color: var(--green);
    }

    .req.ok .dot {
      background: var(--green);
    }

    /* BOTÓN */
    .btn-primary {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 11px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }

    .btn-primary:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: scale(0.99);
    }

    /* YA TENGO CUENTA */
    .card-footer {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    .card-footer a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }

    .card-footer a:hover {
      text-decoration: underline;
    }

    /* VOLVER */
    .link-back {
      margin-top: 24px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .link-back:hover {
      color: var(--accent);
    }

    footer {
      margin-top: 28px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>

<body>

  <div class="top-logo">
    <a href="presentacion.html">
      <img src="../imagenes/easyassist.png" alt="EasyAssist">
    </a>
  </div>

  <div class="card">

    <span class="badge">✦ Es gratis, sin complicaciones</span>
    <h1>Crea tu <span>cuenta</span></h1>
    <p class="subtitle">Rellena los datos y en un momento lo tienes listo.</p>

    <div id="msg" class="msg"></div>

    <div class="field">
      <label>Nombre</label>
      <input type="text" id="reg-name" placeholder="Tu nombre">
    </div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="reg-email" placeholder="tu@email.com">
    </div>

    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="reg-password" placeholder="Mínimo 8 caracteres">
      <div class="req-list">
        <div class="req" id="req-len">
          <span class="dot"></span> Al menos 8 caracteres
        </div>
        <div class="req" id="req-num">
          <span class="dot"></span> Un número
        </div>
      </div>
    </div>

    <div class="field">
      <label>Repetir contraseña</label>
      <input type="password" id="reg-password2" placeholder="Repite la contraseña">
    </div>

    <button class="btn-primary" id="btn-register">Crear cuenta</button>

    <div class="card-footer">
      ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
    </div>

  </div>

  <a href="presentacion.html" class="link-back">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    Volver al inicio
  </a>

  <footer>EasyAssist &copy; 2025</footer>

  <script>
    const msgBox   = document.getElementById("msg");
    const passInput = document.getElementById("reg-password");
    const reqLen   = document.getElementById("req-len");
    const reqNum   = document.getElementById("req-num");

    // Validación visual en tiempo real
    passInput.addEventListener("input", () => {
      const val = passInput.value;
      reqLen.classList.toggle("ok", val.length >= 8);
      reqNum.classList.toggle("ok", /\d/.test(val));
    });

    function showMsg(text, type) {
      msgBox.textContent = text;
      msgBox.className = "msg " + type;
    }

    function getUsers() {
      return JSON.parse(localStorage.getItem("ea_users") || "[]");
    }

    function saveUsers(users) {
      localStorage.setItem("ea_users", JSON.stringify(users));
    }

    function setSession(user) {
      localStorage.setItem("ea_session", JSON.stringify({ name: user.name, email: user.email }));
    }

    document.getElementById("btn-register").addEventListener("click", () => {
      const name      = document.getElementById("reg-name").value.trim();
      const email     = document.getElementById("reg-email").value.trim();
      const password  = document.getElementById("reg-password").value;
      const password2 = document.getElementById("reg-password2").value;

      if (!name || !email || !password || !password2) {
        showMsg("Por favor rellena todos los campos.", "error");
        return;
      }

      if (password.length < 8) {
        showMsg("La contraseña debe tener al menos 8 caracteres.", "error");
        return;
      }

      if (!/\d/.test(password)) {
        showMsg("La contraseña debe incluir al menos un número.", "error");
        return;
      }

      if (password !== password2) {
        showMsg("Las contraseñas no coinciden.", "error");
        return;
      }

      const users = getUsers();

      if (users.find(u => u.email === email)) {
        showMsg("Ya existe una cuenta con ese email.", "error");
        return;
      }

      const newUser = { name, email, password };
      users.push(newUser);
      saveUsers(users);
      setSession(newUser);

      showMsg("¡Cuenta creada! Bienvenido, " + name + ". Redirigiendo...", "success");

      setTimeout(() => {
        window.location.href = "presentacion.html";
      }, 1200);
    });

    // Enter para enviar
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("btn-register").click();
    });
  </script>

</body>
</html>
