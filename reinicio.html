<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reinicio del Equipo | EasyAssist</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --bg: #f8fafc;
      --card: #ffffff;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    body.fade-in { opacity: 1; }
    body.fade-out { opacity: 0; }

    .container {
      background: var(--card);
      width: 90%;
      max-width: 520px;
      padding: 48px;
      border-radius: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      text-align: center;
    }

    .logo-container { margin-bottom: 32px; }
    .logo-container img { height: 42px; width: auto; }

    .title {
      font-family: 'DM Serif Display', serif;
      font-size: 30px;
      margin-bottom: 24px;
      color: var(--text);
      line-height: 1.2;
    }

    /* Lista de pasos profesional */
    .steps-container {
      text-align: left;
      background: var(--bg);
      padding: 24px;
      border-radius: 16px;
      margin-bottom: 32px;
      border: 1px solid var(--border);
    }

    .step-item {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      font-size: 16px;
      line-height: 1.5;
    }

    .step-item:last-child { margin-bottom: 0; }

    .step-number {
      background: var(--accent);
      color: white;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .options {
      margin-bottom: 32px;
    }

    .btn-main {
      width: 100%;
      padding: 18px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-main:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }

    .nav-footer {
      border-top: 1px solid var(--border);
      padding-top: 24px;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-weight: 500;
      cursor: pointer;
      font-size: 15px;
      transition: color 0.2s;
    }

    .nav-btn:hover { color: var(--accent); }
  </style>
</head>
<body class="fade-in">

  <main class="container">

    <div class="logo-container">
      <img src="imagenes/easyassist.png" alt="EasyAssist Logo">
    </div>

    <h1 class="title">Ciclo de encendido</h1>

    <div class="steps-container">
      <div class="step-item">
        <span class="step-number">1</span>
        <p>Desconecte el cable de alimentación de su router de la toma de corriente.</p>
      </div>
      <div class="step-item">
        <span class="step-number">2</span>
        <p>Le rogamos que espere al menos <strong>30 segundos</strong> para asegurar un reinicio completo.</p>
      </div>
      <div class="step-item">
        <span class="step-number">3</span>
        <p>Vuelva a conectarlo y aguarde unos minutos hasta que las luces se estabilicen.</p>
      </div>
    </div>

    <div class="options">
      <button class="btn-main" onclick="go('reinicio2.html')">
        He completado el proceso, continuar
      </button>
    </div>

    <footer class="nav-footer">
      <button class="nav-btn" onclick="go('luces.html')">← Volver atrás</button>
    </footer>

  </main>

  <script>
    function go(url) {
      document.body.classList.remove("fade-in");
      document.body.classList.add("fade-out");
      setTimeout(() => {
        window.location.href = url;
      }, 300);
    }
  </script>

</body>
</html>
