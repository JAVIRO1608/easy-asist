<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revisar Cables | EasyAssist</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --bg: #f8fafc;
      --card: #ffffff;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    body.fade-in { opacity: 1; }
    body.fade-out { opacity: 0; }

    .container {
      background: var(--card);
      width: 95%;
      max-width: 500px;
      padding: 40px;
      border-radius: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .logo-container { margin-bottom: 30px; }
    .logo-container img { height: 38px; width: auto; }

    .title {
      font-family: 'DM Serif Display', serif;
      font-size: 28px;
      margin-bottom: 16px;
      color: var(--text);
    }

    /* Ilustración o Icono central */
    .icon-circle {
      width: 80px;
      height: 80px;
      background: var(--accent-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      margin: 0 auto 24px;
    }

    .instruction-text {
      font-size: 17px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .instruction-text strong {
      color: var(--text);
    }

    /* BOTÓN DE ACCIÓN PRINCIPAL (Continuar) */
    .btn-main {
      width: 100%;
      padding: 18px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 20px;
      transition: transform 0.2s, background 0.2s;
    }

    .btn-main:hover { background: #1d4ed8; }

    /* NAVEGACIÓN INFERIOR */
    .nav-footer {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }

    .nav-btn {
      flex: 1;
      padding: 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      background: var(--accent-light);
      color: var(--accent);
      border-color: var(--accent);
    }
  </style>
</head>
<body class="fade-in">

  <main class="container">

    <div class="logo-container">
      <img src="imagenes/easyassist.png" alt="EasyAssist">
    </div>

    <div class="icon-circle">🔌</div>

    <h2 class="title">Revisar cableado</h2>

    <p class="instruction-text">
      Desconecta el cable y vuelve a conectarlo. Asegúrate de que <strong>encaje bien</strong> y escuches un pequeño "clic" tanto en el router como en la pared.
    </p>

    <button class="btn-main" onclick="go('resultado_cableado.html')">
      Ya lo he revisado ✔
    </button>

    <div class="nav-footer">
      <button class="nav-btn" onclick="go('cableado.html')">
        ⬅ Atrás
      </button>
      <button class="nav-btn" onclick="go('index.html')">
        🏠 Inicio
      </button>
    </div>

  </main>

  <script>
    function go(url) {
      document.body.classList.remove("fade-in");
      document.body.classList.add("fade-out");
      setTimeout(() => {
        window.location.href = url;
      }, 300);
    }
  </script>

</body>
</html>
