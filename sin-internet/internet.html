<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paso 1 | EasyAssist</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --bg: #f8fafc;
      --card: #ffffff;
      --green: #16a34a;
      --green-light: #f0fdf4;
      --red: #dc2626;
      --red-light: #fef2f2;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      opacity: 0;
      animation: fadeIn 0.5s ease forwards 0.1s;
      transition: opacity 0.3s ease;
    }

    body.fade-out {
      opacity: 0 !important;
      animation: none;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* NAV */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 48px;
      border-bottom: 1px solid var(--border);
      background: white;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav-logo {
      text-decoration: none;
      display: flex;
      align-items: center;
    }

    .nav-logo img {
      height: 36px;
      width: auto;
    }

    .nav-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px 14px;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      transition: background 0.2s, color 0.2s;
    }

    .nav-back:hover {
      background: var(--accent-light);
      color: var(--accent);
    }

    /* MAIN */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 32px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.05);
      text-align: center;
    }

    /* PROGRESO */
    .progress {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 32px;
    }

    .step-dot {
      width: 8px;
      height: 8px;
      border-radius: 99px;
      background: var(--border);
      transition: background 0.2s, width 0.2s;
    }

    .step-dot.active {
      background: var(--accent);
      width: 24px;
    }

    .step-dot.done {
      background: var(--green);
    }

    /* ICONO */
    .step-icon {
      width: 64px;
      height: 64px;
      background: var(--accent-light);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin: 0 auto 24px;
    }

    /* TEXTOS */
    .step-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(24px, 4vw, 32px);
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 16px;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 36px;
    }

    /* OPCIONES */
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .btn {
      width: 100%;
      padding: 16px 20px;
      border: 1px solid transparent;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: 'DM Sans', sans-serif;
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
    }

    .btn:active {
      transform: scale(0.98);
      box-shadow: none;
    }

    .btn.yes {
      background: var(--green);
      color: white;
    }

    .btn.yes:hover { background: #15803d; }

    .btn.no {
      background: var(--red);
      color: white;
    }

    .btn.no:hover { background: #b91c1c; }

    /* DIVIDER */
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin-bottom: 20px;
    }

    /* VOLVER */
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: color 0.2s;
    }

    .btn-back:hover { color: var(--accent); }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--border);
      padding: 20px 48px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      background: white;
    }
  </style>
</head>

<body>

  <nav>
    <a href="presentacion.html" class="nav-logo">
      <img src="imagenes/easyassist.png" alt="EasyAssist">
    </a>
    <button class="nav-back" onclick="go('seleccion.html')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Volver
    </button>
  </nav>

  <main>
    <div class="card">

      <div class="progress">
        <div class="step-dot active"></div>
        <div class="step-dot"></div>
        <div class="step-dot"></div>
        <div class="step-dot"></div>
      </div>

      <div class="step-icon">📡</div>

      <p class="step-label">Paso 1 de 4 · El router</p>

      <h1>¿Su router tiene luces encendidas?</h1>

      <p class="subtitle">
        El router es el aparato que le da internet en casa. Suele estar cerca de donde entra el cable de la compañía y tiene varias lucecitas.
      </p>

      <div class="options">
        <button class="btn yes" onclick="go('router_si.html')">
          ✔ Sí, tiene luces encendidas
        </button>
        <button class="btn no" onclick="go('router_no.html')">
          ✖ No, está todo apagado
        </button>
      </div>

      <hr class="divider">

      <button class="btn-back" onclick="go('seleccion.html')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Volver al menú
      </button>

    </div>
  </main>

  <footer>
    Hecho con ganas por tres estudiantes de Informática &mdash; EasyAssist &copy; 2025
  </footer>

  <script>
    function go(url) {
      document.body.classList.add("fade-out");
      setTimeout(() => { window.location.href = url; }, 300);
    }
  </script>

</body>
</html>
