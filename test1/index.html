<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyAssist</title>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      font-family: 'Nunito', sans-serif;
      background-color: #f5f7fa;
    }

    .header {
      background-color: #0a84ff;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 3rem;
      font-weight: 800;
    }

    .subtitle {
      text-align: center;
      font-size: 1.2rem;
      margin: 30px 0 20px;
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .main-btn {
      background-color: black;
      color: white;
      border: none;
      padding: 20px;
      font-size: 1.1rem;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .main-btn:hover {
      transform: scale(1.03);
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 2.2rem;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER GRANDE -->
  <div class="header">
    <h1>EasyAssist</h1>
  </div>

  <div class="container">

    <p class="subtitle">Selecciona tu problema</p>

    <!-- OPCIONES TIPO TABLA -->
    <div class="grid">

      <button class="main-btn" onclick="window.location.href='internet.html'">
        No tengo internet
      </button>

      <button class="main-btn">
        Problemas con datos
      </button>

      <button class="main-btn">
        Roaming
      </button>

    </div>

  </div>

</body>
</html>
