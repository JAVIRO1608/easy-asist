<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema operativo | EasyAssist</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --accent: #2563eb; --accent-light: #eff6ff; --accent-border: #bfdbfe; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; --bg: #f8fafc; --card: #ffffff; --green: #16a34a; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; opacity: 0; animation: fadeIn 0.5s ease forwards 0.1s; transition: opacity 0.3s ease; }
    body.fade-out { opacity: 0 !important; animation: none; }
    @keyframes fadeIn { to { opacity: 1; } }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 48px; border-bottom: 1px solid var(--border); background: white; position: sticky; top: 0; z-index: 10; }
    .nav-logo { text-decoration: none; display: flex; align-items: center; }
    .nav-logo img { height: 36px; width: auto; }
    .nav-back { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: var(--muted); background: none; border: none; cursor: pointer; padding: 8px 14px; border-radius: 8px; font-family: 'DM Sans', sans-serif; transition: background 0.2s, color 0.2s; }
    .nav-back:hover { background: var(--accent-light); color: var(--accent); }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 32px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 40px; width: 100%; max-width: 480px; box-shadow: 0 4px 24px rgba(0,0,0,0.05); text-align: center; }
    .progress { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 32px; }
    .step-dot { width: 8px; height: 8px; border-radius: 99px; background: var(--border); }
    .step-dot.done { background: var(--green); }
    .step-dot.active { background: var(--accent); width: 24px; }
    .step-icon { width: 64px; height: 64px; background: var(--accent-light); border: 1px solid var(--accent-border); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 24px; }
    .step-label { font-size: 12px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px; }
    h1 { font-family: 'DM Serif Display', serif; font-size: clamp(24px, 4vw, 32px); letter-spacing: -0.5px; margin-bottom: 12px; }
    .subtitle { font-size: 16px; color: var(--muted); line-height: 1.7; margin-bottom: 32px; }
    .options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px; }
    .option-btn { width: 100%; display: flex; align-items: center; gap: 16px; padding: 18px 22px; background: white; border: 1px solid var(--border); border-radius: 14px; cursor: pointer; text-align: left; transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s; font-family: 'DM Sans', sans-serif; }
    .option-btn:hover { border-color: var(--accent); box-shadow: 0 4px 16px rgba(37,99,235,0.1); transform: translateY(-1px); }
    .option-btn:active { transform: scale(0.99); }
    .option-btn.disabled { opacity: 0.45; cursor: not-allowed; }
    .option-btn.disabled:hover { border-color: var(--border); box-shadow: none; transform: none; }
    .option-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; background: var(--accent-light); }
    .option-text { flex: 1; }
    .option-text strong { display: block; font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .option-text span { font-size: 13px; color: var(--muted); }
    .option-arrow { color: var(--muted); transition: color 0.2s; }
    .option-btn:hover .option-arrow { color: var(--accent); }
    .dev-badge { font-size: 11px; font-weight: 600; background: #fef9c3; color: #854d0e; border: 1px solid #fde68a; border-radius: 99px; padding: 2px 8px; margin-left: 8px; }
    hr { border: none; border-top: 1px solid var(--border); margin-bottom: 16px; }
    .nav-footer { display: flex; justify-content: space-between; align-items: center; }
    .btn-back, .btn-home { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--muted); background: none; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: color 0.2s; }
    .btn-back:hover { color: var(--accent); }
    .btn-home:hover { color: var(--accent); }
    footer { border-top: 1px solid var(--border); padding: 20px 48px; text-align: center; font-size: 13px; color: var(--muted); background: white; }
  </style>
</head>
<body>
  <nav>
    <a href="../general/presentacion.html" class="nav-logo"><img src="../imagenes/easyassist.png" alt="EasyAssist"></a>
    <button class="nav-back" onclick="navegar(23,'volver')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Volver
    </button>
  </nav>

  <main>
    <div class="card">
      <div class="progress">
        <div class="step-dot done"></div>
        <div class="step-dot active"></div>
        <div class="step-dot"></div>
        <div class="step-dot"></div>
      </div>

      <div class="step-icon">📱</div>
      <p class="step-label">Paso 2 · Tipo de dispositivo</p>
      <h1>¿Qué móvil utiliza?</h1>
      <p class="subtitle">Seleccione el sistema operativo de su teléfono para que las instrucciones se adapten a su dispositivo.</p>

      <div class="options">
        <button class="option-btn" id="btn-iphone">
          <div class="option-icon">🍎</div>
          <div class="option-text">
            <strong>iPhone (iOS)</strong>
            <span>Apple iPhone, cualquier modelo</span>
          </div>
          <svg class="option-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>

        <button class="option-btn" id="btn-android">
          <div class="option-icon">🤖</div>
          <div class="option-text">
            <strong>Android</strong>
            <span>Samsung, Xiaomi y otros</span>
          </div>
          <svg class="option-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>

      <hr>
      <div class="nav-footer">
        <button class="btn-back" onclick="navegar(23,'volver')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Volver al paso anterior
        </button>
        <button class="btn-home" onclick="navegar(1,'inicio')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Ir al inicio
        </button>
      </div>
    </div>
  </main>

  <footer>Hecho con ganas por tres estudiantes de Informática &mdash; EasyAssist &copy; 2025</footer>

  <script src="../js/navegacion.js"></script>
  <script>
    const modo = sessionStorage.getItem("roaming_modo");

    document.getElementById("btn-iphone").addEventListener("click", () => {
      navegar(24, "iphone_" + (modo || "activar"));
    });

    document.getElementById("btn-android").addEventListener("click", () => {
      navegar(24, "android");
    });

    function go(url) {
      document.body.classList.add("fade-out");
      setTimeout(() => { window.location.href = url; }, 300);
    }
  </script>
</body>
</html>
