<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso | EasyAssist</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --accent: #2563eb; --border: #e2e8f0; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b; }
    
    /* Usamos fuentes del sistema para evitar bloqueos MIME de servidores externos */
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background: var(--bg); 
      color: var(--text); 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      padding: 20px; 
    }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 32px; width: 100%; max-width: 440px; box-shadow: 0 4px 24px rgba(0,0,0,0.03); }
    .tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 24px; }
    .tab { flex: 1; padding: 12px; font-weight: 700; background: none; border: none; cursor: pointer; color: var(--muted); font-family: inherit; font-size: 16px; }
    .tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
    form { display: flex; flex-direction: column; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; text-align: left; }
    label { font-size: 14px; font-weight: 500; }
    input { padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 15px; width: 100%; }
    .btn { background: var(--accent); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 15px; transition: background 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .alert { padding: 12px; border-radius: 8px; font-size: 14px; display: none; text-align: center; margin-bottom: 16px; font-weight: 500; }
    .alert.error { background: #fef2f2; color: #dc2626; border: 1px solid #fca5a5; }
    .alert.success { background: #f0fdf4; color: #16a34a; border: 1px solid #86efac; }
    .toggle-link { display: block; text-align: center; margin-top: 16px; font-size: 14px; color: var(--muted); text-decoration: none; }
    .toggle-link span { color: var(--accent); font-weight: 500; cursor: pointer; }
  </style>
</head>
<body>

  <div class="card">
    <div class="tabs">
      <button class="tab active" id="tab-login">Iniciar sesión</button>
      <button class="tab" id="tab-registro">Registrarse</button>
    </div>

    <div id="alert-box" class="alert error"></div>

    <form id="form-login">
      <div class="form-group">
        <label for="login-email">Correo Electrónico</label>
        <input type="email" id="login-email" required placeholder="correo@ejemplo.com">
      </div>
      <div class="form-group">
        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn">Entrar al Sistema</button>
      <a class="toggle-link" id="go-to-reg">¿No tienes cuenta? <span>Regístrate</span></a>
    </form>

    <form id="form-registro" style="display: none;">
      <div class="form-group">
        <label for="reg-name">Nombre</label>
        <input type="text" id="reg-name" required placeholder="Tu Nombre">
      </div>
      <div class="form-group">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" required placeholder="correo@ejemplo.com">
      </div>
      <div class="form-group">
        <label for="reg-password">Contraseña</label>
        <input type="password" id="reg-password" required placeholder="••••••••••••">
      </div>
      <div class="form-group">
        <label for="reg-password-confirm">Repetir contraseña</label>
        <input type="password" id="reg-password-confirm" required placeholder="••••••••••••">
      </div>
      <button type="submit" class="btn">Crear cuenta</button>
      <a class="toggle-link" id="go-to-login">¿Ya tienes cuenta? <span>Inicia sesión</span></a>
    </form>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const alertBox = document.getElementById('alert-box');
      const formLogin = document.getElementById('form-login');
      const formRegistro = document.getElementById('form-registro');
      const tabLogin = document.getElementById('tab-login');
      const tabRegistro = document.getElementById('tab-registro');

      function showAlert(msg, type = 'error') {
        alertBox.textContent = msg;
        alertBox.className = `alert ${type}`;
        alertBox.style.display = 'block';
      }

      function switchTab(mode) {
        alertBox.style.display = 'none';
        if (mode === 'login') {
          tabLogin.classList.add('active');
          tabRegistro.classList.remove('active');
          formLogin.style.display = 'flex';
          formRegistro.style.display = 'none';
        } else {
          tabRegistro.classList.add('active');
          tabLogin.classList.remove('active');
          formLogin.style.display = 'none';
          formRegistro.style.display = 'flex';
        }
      }

      tabLogin.addEventListener('click', () => switchTab('login'));
      tabRegistro.addEventListener('click', () => switchTab('registro'));
      document.getElementById('go-to-reg').addEventListener('click', () => switchTab('registro'));
      document.getElementById('go-to-login').addEventListener('click', () => switchTab('login'));

      // PROCESAR LOGIN MANUAL
      formLogin.addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          const res = await fetch('../php/login_action.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: document.getElementById('login-email').value,
              password: document.getElementById('login-password').value
            })
          });
          
          const data = await res.json();
          
          if (res.ok && data.status === 'success') {
            window.location.replace('./presentacion.html');
          } else {
            showAlert(data.message || 'Credenciales incorrectas.');
          }
        } catch (err) {
          showAlert('Error de conexión con el servidor.');
        }
      });

      // PROCESAR REGISTRO + LOGIN AUTOMÁTICO
      formRegistro.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const password = document.getElementById('reg-password').value;
        const passwordConfirm = document.getElementById('reg-password-confirm').value;

        if (password !== passwordConfirm) {
          showAlert('Las contraseñas introducidas no coinciden.');
          return;
        }

        try {
          const res = await fetch('../php/registro.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: document.getElementById('reg-name').value,
              email: document.getElementById('reg-email').value,
              password: password
            })
          });
          
          const data = await res.json();
          
          if (res.ok && data.status === 'success') {
            window.location.replace('./presentacion.html');
          } else {
            showAlert(data.message || 'Error al procesar el registro.');
          }
        } catch (err) {
          showAlert('Error de red o desconexión del servidor.');
        }
      });
    });
  </script>
</body>
</html>
