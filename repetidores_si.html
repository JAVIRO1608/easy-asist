<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Repetidores | EasyAssist</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --bg: #f8fafc;
      --card: #ffffff;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    body.fade-in { opacity: 1; }
    body.fade-out { opacity: 0; }

    .container {
      background: var(--card);
      width: 90%;
      max-width: 520px;
      padding: 48px;
      border-radius: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      text-align: center;
    }

    .logo-container { margin-bottom: 32px; }
    .logo-container img { height: 42px; width: auto; }

    .title {
      font-family: 'DM Serif Display', serif;
      font-size: 30px;
      margin-bottom: 24px;
      color: var(--text);
      line-height: 1.2;
    }

    /* Caja informativa profesional */
    .instruction-card {
      background: var(--accent-light);
      padding: 24px;
      border-radius: 16px;
      margin-bottom: 32px;
      border-left: 4px solid var(--accent);
      text-align: left;
    }

    .instruction-card p {
      font-size: 16px;
      line-height: 1.6;
      color: var(--text);
      margin-bottom: 0;
    }

    .instruction-card strong {
      color: var(--accent);
    }

    .btn-action {
      width: 100%;
      padding: 18px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-action:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }

    .nav-footer {
      margin-top: 24px;
      border-top: 1px solid var(--border);
      padding-top: 24px;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-weight: 500;
      cursor: pointer;
      font-size: 14px;
      transition: color 0.2s;
    }

    .nav-btn:hover { color: var(--accent); }
  </style>
</head>
<body class="fade-in">

  <main class="container">

    <div class="logo-container">
      <img src="imagenes/easyassist.png" alt="EasyAssist Logo">
    </div>

    <h1 class="title">Optimización de señal</h1>

    <div class="instruction-card">
      <p>
        Le solicitamos que <strong>desconecte temporalmente</strong> todos los repetidores o amplificadores de señal WiFi de su domicilio.
      </p>
    </div>

    <p style="color: var(--muted); font-size: 15px; margin-bottom: 32px; line-height: 1.5;">
      Este paso es necesario para descartar interferencias externas y asegurar que la señal provenga directamente de su router principal.
    </p>

    <button class="btn-action" onclick="go('repetidores.html')">
      He realizado la desconexión
    </button>

    <footer class="nav-footer">
      <button class="nav-btn" onclick="go('repetidores.html')">← Volver atrás</button>
    </footer>

  </main>

  <script>
    function go(url) {
      document.body.classList.remove("fade-in");
      document.body.classList.add("fade-out");
      setTimeout(() => {
        window.location.href = url;
      }, 300);
    }
  </script>

</body>
</html>
