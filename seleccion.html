<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selección | EasyAssist</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --bg: #f8fafc;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      opacity: 0;
      animation: fadeIn 0.5s ease forwards 0.1s;
      transition: opacity 0.3s ease;
    }

    body.fade-out {
      opacity: 0 !important;
      animation: none;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 48px;
      border-bottom: 1px solid var(--border);
      background: white;
    }

    .nav-logo {
      text-decoration: none;
      display: flex;
      align-items: center;
    }

    .nav-logo img {
      height: 36px;
      width: auto;
    }

    .nav-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 8px;
      transition: background 0.2s, color 0.2s;
    }

    .nav-back:hover {
      background: var(--accent-light);
      color: var(--accent);
    }

    .nav-back svg {
      transition: transform 0.2s;
    }

    .nav-back:hover svg {
      transform: translateX(-3px);
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 32px;
    }

    .hero {
      max-width: 650px;
      width: 100%;
      text-align: center;
    }

    .hero h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(30px, 5vw, 42px);
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 16px;
      color: var(--muted);
      margin-bottom: 40px;
      line-height: 1.7;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 22px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
      font-family: 'DM Sans', sans-serif;
    }

    .option-btn:hover {
      border-color: var(--accent);
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.1);
      transform: translateY(-1px);
    }

    .option-btn:active {
      transform: scale(0.99);
    }

    .option-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .icon-blue  { background: #eff6ff; }
    .icon-green { background: #f0fdf4; }

    .option-text {
      flex: 1;
    }

    .option-text strong {
      display: block;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 2px;
    }

    .option-text span {
      font-size: 13px;
      color: var(--muted);
    }

    .option-arrow {
      color: var(--muted);
      transition: color 0.2s;
    }

    .option-btn:hover .option-arrow {
      color: var(--accent);
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 20px 48px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      background: white;
    }
  </style>
</head>

<body>

  <nav>
    <a href="presentacion.html" class="nav-logo">
      <img src="imagenes/easyassist.png" alt="EasyAssist">
    </a>
    <a href="presentacion.html" class="nav-back" onclick="fadeGo(event, 'presentacion.html')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Volver
    </a>
  </nav>

  <main>
    <div class="hero">

      <h1>¿Qué problema tiene?</h1>
      <p>Seleccione la categoría que mejor describa su problema.</p>

      <div class="options">

        <button class="option-btn" onclick="fadeGo(event, 'internet.html')">
          <div class="option-icon icon-blue">📶</div>
          <div class="option-text">
            <strong>Problemas de conexión</strong>
            <span>Sin conexión o conexión lenta</span>
          </div>
          <svg class="option-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>

        <button class="option-btn" onclick="fadeGo(event, 'datos.html')">
          <div class="option-icon icon-green">📱</div>
          <div class="option-text">
            <strong>Datos móviles</strong>
            <span>Sin datos móviles o conexión lenta</span>
          </div>
          <svg class="option-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>

        <button class="option-btn" onclick="fadeGo(event, 'roaming.html')">
          <div class="option-icon icon-green">🌍</div>
          <div class="option-text">
            <strong>Roaming</strong>
            <span>Problemas de conexión en el extranjero</span>
          </div>
          <svg class="option-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>

      </div>

    </div>
  </main>

  <footer>
    Hecho con ganas por tres estudiantes de Informática &mdash; EasyAssist &copy; 2025
  </footer>

  <script>
    function fadeGo(e, url) {
      e.preventDefault();
      document.body.classList.add("fade-out");
      setTimeout(() => { window.location.href = url; }, 300);
    }
  </script>

</body>
</html>
