<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | EasyAssist</title>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: #f4f6f8;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 18px;
      text-align: center;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    img {
      width: 180px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 15px;
    }

    p {
      color: #555;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    a.email {
      display: inline-block;
      font-size: 18px;
      font-weight: 700;
      color: #111;
      text-decoration: none;
      margin-bottom: 25px;
    }

    a.email:hover {
      text-decoration: underline;
    }

    .btn {
      background: #111;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="card">

    <img src="imagenes/easyassist.png" alt="EasyAssist">

    <h1>Contacto</h1>

    <p>
      Si tienes dudas, sugerencias o necesitas ayuda adicional, puedes contactarnos directamente.
      Te responderemos lo antes posible.
    </p>

    <a class="email" href="mailto:easyassist@gmail.com">
      easyassist@gmail.com
    </a>

    <br>

    <button class="btn" onclick="window.location.href='presentacion.html'">
      Volver al inicio
    </button>

  </div>

  <script>
  window.addEventListener("load", () => {
    document.body.classList.add("fade-in");
  });
</script>

</body>
</html>
