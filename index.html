<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistencia Técnica Profesional | EasyAssist</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --bg: #f8fafc;
      --card: #ffffff;
      --success: #16a34a;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    body.fade-in { opacity: 1; }
    body.fade-out { opacity: 0; }

    .container {
      background: var(--card);
      width: 90%;
      max-width: 520px;
      padding: 56px 48px;
      border-radius: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      text-align: center;
    }

    .logo-container { margin-bottom: 24px; }
    .logo-container img { height: 44px; width: auto; }

    .tagline {
      font-size: 15px;
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }

    .divider {
      width: 40px;
      height: 3px;
      background: var(--accent);
      margin: 0 auto 32px;
      border-radius: 2px;
    }

    .title {
      font-family: 'DM Serif Display', serif;
      font-size: 32px;
      margin-bottom: 12px;
      color: var(--text);
      line-height: 1.2;
    }

    .subtitle {
      font-size: 17px;
      color: var(--muted);
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn {
      width: 100%;
      padding: 20px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn.yes {
      background: var(--accent);
      color: white;
    }
    .btn.yes:hover { 
      background: #1d4ed8; 
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }

    .btn.no {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn.no:hover { 
      background: var(--accent-light);
      color: var(--accent);
      border-color: var(--accent);
    }
  </style>
</head>
<body class="fade-in">

  <main class="container">

    <div class="logo-container">
      <img src="imagenes/easyassist.png" alt="EasyAssist">
    </div>

    <p class="tagline">Asistencia Técnica Guiada</p>
    
    <div class="divider"></div>

    <h1 class="title">¿Presenta usted problemas con su conexión?</h1>
    <p class="subtitle">
      Por favor, seleccione una opción para comenzar el proceso de diagnóstico.
    </p>

    <div class="options">
      <button class="btn yes" onclick="go('internet.html')">
        Sí, deseo recibir asistencia
      </button>

      <button class="btn no" onclick="go('fin.html')">
        No, mi conexión funciona correctamente
      </button>
    </div>

  </main>

  <script>
    function go(url) {
      document.body.classList.remove("fade-in");
      document.body.classList.add("fade-out");
      setTimeout(() => {
        window.location.href = url;
      }, 300);
    }
  </script>

</body>
</html>
